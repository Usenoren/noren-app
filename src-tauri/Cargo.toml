[workspace]
members = ["noren-engine"]
resolver = "2"

[package]
name = "noren-app"
version = "1.0.1"
description = "Noren desktop app. Voice consistency engine for AI writing."
license = "MIT"
edition = "2021"
default-run = "noren-app"

[dependencies]
noren-engine = { path = "./noren-engine" }
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-shell = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
pdf-extract = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
security-framework = "3"
objc = "0.2"
cocoa = "0.26"
aes-gcm = "0.10"
base64 = "0.22"
sha2 = "0.10"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[[bin]]
name = "noren-app"
path = "src/main.rs"

[[bin]]
name = "noren-keychain-host"
path = "src/bin/noren-keychain-host.rs"
