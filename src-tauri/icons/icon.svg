<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#243A54"/>
      <stop offset="100%" stop-color="#1A2C42"/>
    </linearGradient>
  </defs>

  <!-- macOS rounded-rect background -->
  <rect width="1024" height="1024" rx="228" ry="228" fill="url(#bg)"/>

  <!-- Noren mark, scaled down to ~60% with proper centering -->
  <g transform="translate(512, 490) scale(5.8) translate(-40, -48)">
    <!-- Left curtain panel -->
    <path d="M8 8C8 8 8 68 8 74C8 80 14 88 22 88C30 88 33 80 33 74L33 8" stroke="#F0E8DD" stroke-width="6" stroke-linecap="round" fill="none"/>
    <!-- Right curtain panel -->
    <path d="M47 8C47 8 47 68 47 74C47 80 50 88 58 88C66 88 72 80 72 74L72 8" stroke="#F0E8DD" stroke-width="6" stroke-linecap="round" fill="none"/>
    <!-- Accent thread between panels -->
    <path d="M33 64C37 74 43 74 47 64" stroke="#C44A2F" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <!-- Top beams -->
    <line x1="8" y1="8" x2="33" y2="8" stroke="#F0E8DD" stroke-width="6" stroke-linecap="round"/>
    <line x1="47" y1="8" x2="72" y2="8" stroke="#F0E8DD" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
