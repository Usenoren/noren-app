[package]
name = "noren-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
reqwest = { version = "0.12", features = ["json"] }
async-trait = "0.1"
aes-gcm = "0.10"
rust-stemmers = "1.2"
rand = "0.8"

[dev-dependencies]
tempfile = "3"
